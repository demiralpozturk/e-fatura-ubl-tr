name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      EFATURA_CACHE_DIR: ${{ github.workspace }}/.efatura-cache
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Cache key (ISO week)
        id: week
        shell: bash
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore GİB schema cache
        uses: actions/cache@v4
        with:
          path: .efatura-cache
          key: gib-ubltr-${{ runner.os }}-${{ steps.week.outputs.week }}
      # GİB's files are downloaded at runtime and never committed. If ebelge.gib.gov.tr is
      # unreachable from the runner, the real-schema tests are skipped instead of failing.
      - name: Fetch GİB schema package
        id: gib
        continue-on-error: true
        run: efatura schemas fetch
      - name: Pytest
        env:
          EFATURA_REQUIRE_GIB: ${{ steps.gib.outcome == 'success' && '1' || '0' }}
        run: python -m pytest -v
      - name: CLI smoke test (build, validate, preview)
        if: steps.gib.outcome == 'success'
        shell: bash
        run: |
          for f in examples/*.json; do
            efatura build "$f" -o "out-$(basename "$f" .json).xml"
            efatura validate "out-$(basename "$f" .json).xml" --no-download
            efatura preview "out-$(basename "$f" .json).xml"
          done
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.gib.outcome }}" = "success" ]; then
            echo "GİB XSD + schematron validation: executed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GİB XSD + schematron validation: SKIPPED (package download failed)" >> "$GITHUB_STEP_SUMMARY"
          fi
